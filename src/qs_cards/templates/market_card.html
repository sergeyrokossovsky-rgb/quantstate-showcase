<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c0f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8eaf0;padding:16px}
.card{width:{{ card_w }}px;border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;background:#111318}
.hdr{background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(16,185,129,.06));padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid rgba(255,255,255,.07)}
.title{font-size:19px;font-weight:700}
.stamp{font-family:ui-monospace,monospace;font-size:10px;color:#8a8f9e}
.row{display:grid;grid-template-columns:56px 1fr 120px;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid rgba(255,255,255,.07)}
.sym{font-size:16px;font-weight:700}
.bar{height:10px;background:#181c22;border-radius:5px;position:relative}
.fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
.lbl{font-family:ui-monospace,monospace;font-size:9px;color:#50566a;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.nums{font-family:ui-monospace,monospace;font-size:12px;text-align:right;line-height:1.4}
.why{grid-column:2/4;font-size:11px;color:#8a8f9e;margin-top:-4px}
.foot{font-family:ui-monospace,monospace;font-size:9px;color:#50566a;padding:9px 20px;border-top:1px solid rgba(255,255,255,.07)}
</style>
</head>
<body>
<div class="card">
  <div class="hdr"><div class="title">{{ title }}</div><div class="stamp">{{ stamp }}</div></div>
  {% for r in rows %}
  <div class="row">
    <div class="sym">{{ r.symbol }}</div>
    <div><div class="lbl">stress {{ r.vol }} · range {{ r.range_lo }}–{{ r.range_hi }}</div>
      <div class="bar"><div class="fill" style="width:{{ r.vol_w }}%;background:{{ r.color }}"></div></div></div>
    <div class="nums">median {{ r.range_med }}<br>P(strong) <b>{{ r.p_txt }}</b></div>
    <div class="why">{{ r.why }}</div>
  </div>
  {% endfor %}
  <div class="foot">sample data · informational only</div>
</div>
</body>
</html>
